<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ToneMatch mark (D-034): skin ring (ink) meets metal ring (gold). Same drawing as Logo.tsx. -->
  <style>
    .skin { stroke: #1e1a17; }
    @media (prefers-color-scheme: dark) { .skin { stroke: #f3ece2; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7430"/>
      <stop offset="0.5" stop-color="#e6cb86"/>
      <stop offset="1" stop-color="#8a6526"/>
    </linearGradient>
  </defs>
  <circle class="skin" cx="11.5" cy="16" r="8.5" fill="none" stroke-width="2"/>
  <circle cx="20.5" cy="16" r="8.5" fill="none" stroke="url(#g)" stroke-width="3"/>
</svg>
