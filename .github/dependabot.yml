# Dependabot version updates (README §9.6): weekly, minor + patch grouped, majors as separate PRs.
# Commit prefixes keep PR titles valid Conventional Commits, e.g. "chore(deps): bump next ...".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors held back on purpose (docs/DECISIONS.md D-012). Remove a rule when its reason is gone.
    ignore:
      # Stay on TypeScript 5.x until typescript-eslint supports newer majors.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Stay on ESLint 9 until eslint-plugin-jsx-a11y supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Node types must match the Node 24 runtime (.nvmrc). Bump together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
