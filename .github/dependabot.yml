# Dependabot version updates (README §9.6): weekly, minor + patch grouped, majors as separate PRs.
# Commit prefixes keep PR titles valid Conventional Commits, e.g. "chore(deps): bump next ...".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
