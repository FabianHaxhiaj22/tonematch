# release-please (README §9.4): opens/updates a release PR from Conventional Commits on main;
# merging it bumps package.json, updates CHANGELOG.md, tags and creates a GitHub Release.
#
# Uses the RELEASE_PLEASE_TOKEN secret (fine-grained PAT, this repo only), NOT GITHUB_TOKEN:
# PRs opened with GITHUB_TOKEN don't trigger other workflows, so the release PR would never get
# the required `ci` / `pr-title` checks. See docs/REPO_SETUP.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
